{% extends "base.html" %}{% block title %}Add prospect{% endblock %}{% block content %}<h1>Add prospect manually</h1>
<form class="card" method="post" action="/prospects/new" style="max-width:640px"><input type="hidden" name="csrf" value="{{ csrf }}">
<p class="small muted">Enter only details you have seen in a public source. Say where in "Source URL".</p>
<label>Dealership name *</label><input name="name" required style="width:100%">
<label>Website</label><input name="website" style="width:100%"><label>Inventory page URL</label><input name="inventory_url" style="width:100%">
<label>Street address</label><input name="address_line" style="width:100%">
<div class="row"><div><label>City</label><input name="city"></div><div><label>State</label><input name="state" value="TX" size="3"></div><div><label>ZIP</label><input name="postal_code" size="7"></div></div>
<div class="row"><div><label>Public business phone</label><input name="phone"></div><div><label>Public business email</label><input name="email" type="email"></div></div>
<label>Dealership type</label><select name="dealership_type">{% for t in dtypes %}<option>{{ t }}</option>{% endfor %}</select>
<label>Source URL (where you found this)</label><input name="source_url" style="width:100%">
<label>Notes</label><textarea name="notes"></textarea><p><button>Save</button></p></form>{% endblock %}
