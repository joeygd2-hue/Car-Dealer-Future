[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-dealer-future"
version = "0.2.0"
description = "AI-powered marketing and operations platform for independent used-car dealerships"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.140",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "cryptography>=42",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
