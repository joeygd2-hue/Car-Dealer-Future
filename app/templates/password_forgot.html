{% extends "base.html" %}{% block content %}<div class="card" style="max-width:420px;margin:40px auto"><h1>Reset password</h1>
{% if sent %}<p>If that email belongs to an active account, a reset link is on its way. It expires in {{ settings.password_reset_ttl_minutes }} minutes.</p>
{% else %}<form method="post" action="/password/forgot"><label>Email</label><input type="email" name="email" required><p><button class="primary">Send reset link</button></p></form>{% endif %}</div>{% endblock %}
