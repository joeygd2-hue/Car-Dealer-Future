# Production notes: put a TLS reverse proxy in front of `web`, keep secrets out of .env
# (use the `secrets:` block below), and run `python -m dealerflow backup /backups` on a schedule.
x-app: &app
  build: .
  env_file: .env            # non-secret settings only
  volumes: ["./state:/data", "./backups:/backups"]
  secrets: [df_secret_key, df_encryption_key]  # add df_smtp_password, df_google_refresh_token, ... as needed
  environment:
    DF_SECRETS_DIR: /run/secrets

services:
  migrate:
    <<: *app
    command: ["python", "-m", "dealerflow", "migrate"]
  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["python", "-m", "dealerflow", "worker"]

secrets:
  df_secret_key:
    # One file per secret, named like the variable in lower case. The container runs as uid 10001:
    #   chown 10001:10001 secrets/* && chmod 400 secrets/*
    file: ./secrets/df_secret_key
  df_encryption_key:
    # Fernet key for MFA secrets and stored receipts (required in production):
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > secrets/df_encryption_key
    file: ./secrets/df_encryption_key
