{% extends "portal/_layout.html" %}{% block content %}<h1>Notifications</h1>
{% for n in items %}<div class="card"><strong>{{ n.subject }}</strong> <span class="small muted">{{ n.created_at|dt }} · {{ n.kind }}</span><p class="small" style="white-space:pre-wrap">{{ n.body }}</p>{% if n.link %}<a href="{{ n.link }}">Open</a>{% endif %}</div>
{% else %}<p class="muted">No notifications.</p>{% endfor %}{% endblock %}
