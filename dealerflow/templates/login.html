{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<div class="card" style="max-width:380px;margin:40px auto"><h1>Log in</h1>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
<label>Email</label><input name="email" type="email" required autocomplete="username" style="width:100%">
<label>Password</label><input name="password" type="password" required autocomplete="current-password" style="width:100%">
<p><button>Log in</button></p></form><p class="small"><a href="/password/forgot">Forgot password?</a></p></div>{% endblock %}
