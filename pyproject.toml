[project]
name = "dealerflow"
version = "0.1.0"
description = "Prospecting, CRM and outreach system for selling marketing automation to independent used-car dealerships"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "openpyxl>=3.1",
  "tzdata>=2024.1",
  "beautifulsoup4>=4.12",  # SEO audits and website research parsing
  "email-validator>=2.1",  # pydantic EmailStr in the Phase 4 API
  "xlrd>=2.0",
  "defusedxml>=0.7",  # ADF/XML lead intake (Phase 3)
  "cryptography>=42",  # MFA secret at rest (Fernet)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=1.15"]  # optional Claude API (listing generation, AI gateway)
dev = ["pytest>=8", "anthropic>=1.15", "ruff>=0.6"]
e2e = ["playwright>=1.48"]  # scripts/e2e_pilot_check.py (uses an installed Chromium; set E2E_CHROMIUM)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealerflow*"]

[tool.setuptools.package-data]
dealerflow = ["templates/*.html", "templates/**/*.html", "static/*", "fixtures/*", "evals/*", "migrations/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures imported at module level and requested by name
"dealerflow/migrations/versions/*" = ["E501"]
