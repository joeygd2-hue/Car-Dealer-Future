[project]
name = "dealerflow"
version = "0.1.0"
description = "Prospecting, CRM and outreach system for selling marketing automation to independent used-car dealerships"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "openpyxl>=3.1",
  "tzdata>=2024.1",
  "xlrd>=2.0",
  "beautifulsoup4>=4.12",  # SEO audits and website research parsing
  "email-validator>=2.1",  # pydantic EmailStr in the Phase 4 API
  "defusedxml>=0.7.1",  # Phase 3 ADF/XML lead intake (XXE-safe parsing)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=1.15"]  # optional Claude API (DF_AI_ENABLED)
dev = ["pytest>=8", "anthropic>=1.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealerflow*"]

[tool.setuptools.package-data]
dealerflow = ["templates/*.html", "templates/**/*.html", "static/*", "fixtures/*", "fixtures/**/*", "migrations/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
