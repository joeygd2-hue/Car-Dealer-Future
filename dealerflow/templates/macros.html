{% macro rs(x) %}{{ x.real }}{% if x.simulated %} <span class="pill sim" title="simulated records, not counted as real">+{{ x.simulated }} sim</span>{% endif %}{% endmacro %}
{% macro csrf_field(csrf) %}<input type="hidden" name="csrf" value="{{ csrf }}">{% endmacro %}
{% macro sim(flag) %}{% if flag %}<span class="pill sim">SIMULATED</span>{% endif %}{% endmacro %}
{% macro status_pill(s) %}<span class="pill {% if s in ('sent','delivered','booked','completed','ok','done','replied','won') %}ok{% elif s in ('failed','bounced','error','auth_error','cancelled','lost','do_not_contact','emergency_stopped') %}bad{% elif s in ('draft','queued','pending','pending_approval','requested','paused','rate_limited') %}warn{% endif %}">{{ s }}</span>{% endmacro %}
