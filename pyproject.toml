[project]
name = "car-dealer-future"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
