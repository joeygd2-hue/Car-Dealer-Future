{% extends "base.html" %}{% block content %}<div class="card" style="max-width:420px;margin:40px auto"><h1>Choose a new password</h1>
{% if not valid %}<p>This link is invalid, already used, or expired. <a href="/password/forgot">Request a new one</a>.</p>
{% else %}{% if error %}<div class="flash err">{{ error }}</div>{% endif %}<form method="post" action="/password/reset/{{ token }}">
<label>New password (10+ characters)</label><input type="password" name="new_password" required minlength="10" autocomplete="new-password">
<label>Confirm</label><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"><p><button class="primary">Save password</button></p></form>{% endif %}</div>{% endblock %}
